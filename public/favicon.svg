<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="togaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6f41" />
      <stop offset="50%" stop-color="#235c34" />
      <stop offset="100%" stop-color="#143c20" />
    </linearGradient>

    <!-- Leaf Main Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ce8a5" />
      <stop offset="100%" stop-color="#2eb85c" />
    </linearGradient>

    <!-- Golden Sun / Herbal Pill Sparkle Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="100%" stop-color="#ebaa2d" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071c0d" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="512" height="512" rx="128" fill="url(#togaBg)" />

  <!-- Subtle Border Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="8" />

  <!-- Leaf & Herbal Motif -->
  <g filter="url(#shadow)">
    <!-- Main Leaf Body -->
    <path d="M256 90 C350 90, 420 165, 420 265 C420 365, 335 415, 256 426 C177 415, 92 365, 92 265 C92 165, 162 90, 256 90 Z" fill="url(#leafGrad)" />
    
    <!-- Translucent Overlay Leaf Shading -->
    <path d="M256 90 C195 125, 132 200, 132 275 C132 340, 185 390, 256 426 C238 350, 248 215, 256 90 Z" fill="#ffffff" fill-opacity="0.22" />

    <!-- Stem & Main Vein -->
    <path d="M256 426 Q256 270 325 175" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Veins -->
    <path d="M256 345 Q290 325 320 330" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <path d="M256 285 Q300 258 338 268" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <path d="M256 225 Q295 198 328 208" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

    <!-- Left Veins -->
    <path d="M256 365 Q228 348 200 354" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="12" stroke-linecap="round" />
    <path d="M256 305 Q218 282 185 290" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="12" stroke-linecap="round" />
    <path d="M256 245 Q225 224 195 230" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Accent Herbal Sparkle Dot -->
  <circle cx="385" cy="125" r="26" fill="url(#accentGrad)" />
  <circle cx="385" cy="125" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" />
</svg>