<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d27" />
      <stop offset="50%" stop-color="#2f6f41" />
      <stop offset="100%" stop-color="#143c20" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ce8a5" />
      <stop offset="100%" stop-color="#2eb85c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a" />
      <stop offset="100%" stop-color="#ebaa2d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#071c0d" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Decorative Circles -->
  <circle cx="1100" cy="100" r="300" fill="#ffffff" fill-opacity="0.04" />
  <circle cx="100" cy="550" r="250" fill="#ffffff" fill-opacity="0.03" />

  <!-- Logo Mark Container (Left Side) -->
  <g transform="translate(140, 165)" filter="url(#shadow)">
    <!-- Tile Background -->
    <rect width="300" height="300" rx="75" fill="#235c34" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />
    
    <!-- Leaf SVG inside tile -->
    <g transform="translate(25, 25) scale(0.488)">
      <path d="M256 90 C350 90, 420 165, 420 265 C420 365, 335 415, 256 426 C177 415, 92 365, 92 265 C92 165, 162 90, 256 90 Z" fill="url(#leafGrad)" />
      <path d="M256 90 C195 125, 132 200, 132 275 C132 340, 185 390, 256 426 C238 350, 248 215, 256 90 Z" fill="#ffffff" fill-opacity="0.22" />
      <path d="M256 426 Q256 270 325 175" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
      <path d="M256 345 Q290 325 320 330" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
      <path d="M256 285 Q300 258 338 268" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
      <path d="M256 225 Q295 198 328 208" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
      <path d="M256 365 Q228 348 200 354" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="12" opacity="0.8" />
      <path d="M256 305 Q218 282 185 290" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="12" opacity="0.8" />
      <circle cx="385" cy="125" r="26" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Text Content (Right Side) -->
  <g transform="translate(490, 230)">
    <!-- Badge -->
    <rect x="0" y="0" width="240" height="42" rx="21" fill="#8ce8a5" fill-opacity="0.2" stroke="#8ce8a5" stroke-opacity="0.4" stroke-width="2" />
    <text x="120" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#8ce8a5" text-anchor="middle" letter-spacing="1.5">KESEHATAN HERBAL</text>

    <!-- Main Title -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff">TOGA Pedia Desa</text>

    <!-- Subtitle -->
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#d0e8d7">Ensiklopedia Tanaman Obat Keluarga Digital</text>
    <text x="0" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="300" fill="#9ec9aa">Panduan khasiat medis, takaran aman, &amp; budidaya tanaman herbal</text>
  </g>
</svg>
